services:
  nginx-auth:
    build: ./build/dev/nginx
    ports:
      - '82:80'
    depends_on:
      - api-auth
    volumes:
      - ./build/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend-auth:
      chickchirick-shared-network:
        aliases:
          - api-auth-nginx
  api-auth:
    build:
      context: .
      dockerfile: ./build/dev/Dockerfile
    ports:
      - "8082:8080"
      - "40001:40000" # Порт для подключения IDE к отладчику
      - "6061:6060" #Порт трассировщика
      - "50051:50051" #Порт для GRPC
    cap_add:
      - SYS_PTRACE # Разрешает Delve управлять процессом
    security_opt:
      - "seccomp=unconfined" # Отключает фильтрацию системных вызовов
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      backend-auth:
      chickchirick-shared-network:
