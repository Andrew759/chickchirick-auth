services:
  nginx-auth:
    build: ./build/prod/nginx
    ports:
      - '82:80'
    depends_on:
      - api-auth
    networks:
      - backend-auth
  api-auth:
    build:
      context: .
      dockerfile: ./build/prod/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - backend-auth

  redis-auth:
    image: redis:latest
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_INTERNAL_PORT}
    networks:
      - backend-auth

  postgres-auth:
    image: postgres:17.2
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:${DB_INTERNAL_PORT}
    networks:
      - backend-auth
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend-auth: